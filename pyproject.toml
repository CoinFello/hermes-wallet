[project]
name = "hermes-coinfello"
version = "0.3.1"
description = "CoinFello plugin for Hermes Agent: MCP session management, wallet reads and the Fello DeFi agent"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "CoinFello" }]
# Installed by Hermes's plugin admission (`hermes plugins enable coinfello`),
# never by hand. segno renders the pane's funding QR code; pure Python.
dependencies = ["segno>=1.6,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
