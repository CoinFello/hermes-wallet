name: coinfello
label: CoinFello
kind: standalone
version: 0.1.0
author: CoinFello
homepage: https://github.com/CoinFello/coinfello-hermes-plugin
description: >
  CoinFello for Hermes Agent: sign in through the CoinFello MCP server
  (Privy email code, assisted by the desktop pane) and give the agent fast
  reads over the automation wallet (balances, positions, LP ranges, open
  orders, activity, prices, yields, swap/bridge quotes) plus Fello,
  CoinFello's DeFi agent, which can execute on-chain actions. Includes a
  desktop pane for sign-in, wallet overview and sign-out.
requires_hermes: ">=0.21.0"
provides_tools:
  - coinfello_status
  - coinfello_connect
  - coinfello_verify
  - coinfello_poll_approval
  - coinfello_disconnect
  - coinfello_chat
  - coinfello_job_status
  - coinfello_balances
  - coinfello_positions
  - coinfello_lp_positions
  - coinfello_open_orders
  - coinfello_activity
  - coinfello_quote
  - coinfello_prepare_swap
  - coinfello_prepare_send
  - coinfello_execute
  - coinfello_transfer_status
  - coinfello_yields
  - coinfello_prices
provides_hooks:
  - pre_tool_call
optional_env:
  - name: COINFELLO_MCP_URL
    description: "CoinFello MCP endpoint (streamable HTTP). Default: https://app.coinfello.com/api/mcp/mcp"
    prompt: "CoinFello MCP URL"
    password: false
