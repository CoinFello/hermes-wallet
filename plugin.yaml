name: coinfello
label: Hermes Wallet by CoinFello
kind: standalone
version: "0.3.4"
author: CoinFello
homepage: https://github.com/CoinFello/hermes-wallet
description: >
  Hermes Wallet by CoinFello: sign in once with
  `hermes auth add coinfello:coinfello` and your agent gets a CoinFello wallet
  it can use onchain. It reads balances, positions, LP ranges, open orders,
  activity, prices, yields and quotes, asks Fello, CoinFello's DeFi agent, to
  research and plan, and prepares swaps, bridges and sends that you approve in
  Hermes, inside a daily spending limit you set on CoinFello. Hermes stores the
  sign-in; the plugin never sees a token. The desktop wallet pane covers
  portfolio, activity, swap, send, earn, strategies and settings, and draws
  the CoinFello cards the agent shows.
requires_hermes: ">=0.23.0"
provides_tools:
  - coinfello_status
  - coinfello_connect
  - coinfello_set_daily_limit
  - coinfello_limit_status
  - coinfello_disconnect
  - coinfello_chat
  - coinfello_job_status
  - coinfello_balances
  - coinfello_positions
  - coinfello_lp_positions
  - coinfello_open_orders
  - coinfello_activity
  - coinfello_quote
  - coinfello_prepare_swap
  - coinfello_prepare_send
  - coinfello_execute
  - coinfello_transfer_status
  - coinfello_yields
  - coinfello_prices
  - coinfello_show_card
provides_hooks:
  - pre_tool_call
  - pre_llm_call
# CoinFello sign-in: OAuth 2.1 authorization code + PKCE against CoinFello's
# MCP server. Hermes runs it (`hermes auth add coinfello:coinfello`), stores
# and refreshes the grant, and attaches it only to requests the plugin makes
# through credentialed_provider_request to the hosts below.
oauth:
  - id: coinfello
    authorize_url: https://app.coinfello.com/api/auth/mcp/authorize
    token_url: https://app.coinfello.com/api/auth/mcp/token
    scopes:
      - offline_access
    client_id_env: COINFELLO_OAUTH_CLIENT_ID
    hosts:
      - app.coinfello.com
optional_env:
  - name: COINFELLO_OAUTH_CLIENT_ID
    description: "CoinFello's public OAuth client id for this plugin (not a secret): coinfello-hermes"
    prompt: "CoinFello OAuth client id (enter coinfello-hermes)"
    password: false
